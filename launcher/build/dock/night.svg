<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Saturn icon (night): a glass planet circled by its ring, on a glass squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#1a1e4a"/><stop offset="0.42" stop-color="#2a2470"/><stop offset="1" stop-color="#3a2a68"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.52" r="0.42"><stop offset="0" stop-color="#bfe9ff" stop-opacity="0.6"/><stop offset="0.6" stop-color="#9ad4ff" stop-opacity="0.14"/><stop offset="1" stop-color="#9ad4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.38" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0.16"/></linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <radialGradient id="pl" cx="0.35" cy="0.3" r="0.85"><stop offset="0" stop-color="#c9d6ff"/><stop offset="0.5" stop-color="#7d86ee"/><stop offset="1" stop-color="#2f2a86"/></radialGradient>
    <radialGradient id="pshade" cx="0.7" cy="0.75" r="0.7"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#080a28" stop-opacity="0.45"/></radialGradient>
    <clipPath id="pc"><circle cx="0" cy="0" r="205"/></clipPath>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.35" stop-color="#7fd8ff" stop-opacity="0.95"/><stop offset="0.7" stop-color="#b79cff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#080a28" flood-opacity="0.42"/></filter>
    <clipPath id="rb"><rect x="-500" y="-300" width="1000" height="300"/></clipPath>
    <clipPath id="rf"><rect x="-500" y="0" width="1000" height="300"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <circle cx="250" cy="225" r="170" fill="#fff" opacity="0.24"/>
    <circle cx="512" cy="530" r="360" fill="url(#halo)"/>
    <g transform="translate(512 548) rotate(-16)" clip-path="url(#rb)" fill="none" opacity="0.75">
      <ellipse rx="372" ry="96" stroke="#e8f6ff" stroke-opacity="0.22" stroke-width="44"/>
      <ellipse rx="372" ry="96" stroke="url(#ring)" stroke-width="10" filter="url(#glow)"/>
      <ellipse rx="340" ry="80" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/></g>
    <g transform="translate(512 540)" filter="url(#sh)">
      <circle r="205" fill="url(#pl)"/>
      <g clip-path="url(#pc)" transform="rotate(-16)">
        <rect x="-220" y="-110" width="440" height="34" fill="#cfe0ff" opacity="0.22"/>
        <rect x="-220" y="-40" width="440" height="22" fill="#cfe0ff" opacity="0.16"/>
        <rect x="-220" y="60" width="440" height="40" fill="#cfe0ff" opacity="0.14"/>
      </g>
      <circle r="205" fill="url(#pshade)"/>
      <ellipse cx="-70" cy="-95" rx="95" ry="52" transform="rotate(-30 -70 -95)" fill="#fff" opacity="0.28"/>
      <circle r="205" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="5"/></g>
    <g transform="translate(512 548) rotate(-16)" clip-path="url(#rf)" fill="none">
      <ellipse rx="372" ry="96" stroke="#e8f6ff" stroke-opacity="0.22" stroke-width="44"/>
      <ellipse rx="372" ry="96" stroke="url(#ring)" stroke-width="10" filter="url(#glow)"/>
      <ellipse rx="340" ry="80" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/></g>
    <rect x="100" y="100" width="824" height="824" fill="url(#glass)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#fff" stroke-opacity="0.66" stroke-width="4"/>
</svg>
